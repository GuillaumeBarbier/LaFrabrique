name: Build & publish Docker image

# Pushes ghcr.io/guillaumebarbier/lafabrique:latest on every push to main. The server
# (VPS or NAS) pulls it through Watchtower: nothing to do by hand after the first setup.
# The package must be made public once (GitHub › Packages › lafabrique › Settings), or the
# server must be logged in to GHCR.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # runs-on: [self-hosted, kvm4]   # if the account's Actions minutes run out
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/guillaumebarbier/lafabrique
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          # VPS and Synology "+" models are x86_64. For an ARM NAS add linux/arm64
          # (and docker/setup-qemu-action above): the build gets much slower.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
